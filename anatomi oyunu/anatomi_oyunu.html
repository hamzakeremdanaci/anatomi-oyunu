<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İnsan Anatomi Oyunu - İskelet ve Kaslar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0b0c10;
    color: #e2e8f0;
    overflow-x: hidden;
  }
  header {
    background: #12151d;
    border-bottom: 2px solid #1f2937;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 1.5rem;
    color: #38bdf8;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .controls {
    background: #12151d;
    border-bottom: 1px solid #1f2937;
    padding: 1rem 2rem;
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn-group {
    display: flex;
    background: #1f2937;
    border-radius: 8px;
    padding: 4px;
    border: 1px solid #334155;
  }
  .btn {
    background: transparent;
    border: none;
    color: #94a3b8;
    padding: 0.5rem 1.25rem;
    cursor: pointer;
    border-radius: 6px;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  .btn:hover { color: #fff; background: #334155; }
  .btn.active {
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
  }
  .stage {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem 1rem;
    min-height: 65vh;
    position: relative;
    background: radial-gradient(circle at center, #111827 0%, #020617 100%);
  }
  svg.anatomy {
    background: transparent;
    border-radius: 16px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    max-width: 92vw;
    max-height: 88vh;
    display: block;
    cursor: crosshair;
    outline: none;
  }
  /* İskelet - beyaz kemikler (image 3 tarzı) */
  .bone {
    fill: #f1f5f9;
    stroke: #cbd5e1;
    stroke-width: 2;
    transition: all 0.2s;
  }
  .bone:hover {
    fill: #38bdf8;
    stroke: #0ea5e9;
    filter: drop-shadow(0 0 12px rgba(56,189,248,0.7));
    cursor: pointer;
  }
  .bone.selected {
    fill: #fbbf24;
    stroke: #d97706;
    stroke-width: 3;
    filter: drop-shadow(0 0 16px rgba(251,191,36,0.9));
  }
  /* Kaslar */
  .muscle {
    fill: #c2410c;
    stroke: #7c2d12;
    stroke-width: 1.5;
    transition: all 0.2s;
    opacity: 0.92;
  }
  .muscle:hover {
    fill: #ea580c;
    filter: drop-shadow(0 0 10px rgba(234,88,12,0.7));
    cursor: pointer;
  }
  .muscle.selected {
    fill: #fbbf24;
    stroke: #d97706;
    stroke-width: 2.5;
    filter: drop-shadow(0 0 14px rgba(251,191,36,0.9));
  }
  .label {
    fill: #f8fafc;
    font-size: 10px;
    font-weight: 700;
    pointer-events: none;
    user-select: none;
  }
  .panel {
    position: fixed;
    right: 0;
    top: 150px;
    width: 400px;
    height: 70vh;
    background: #12151d;
    border-left: 1px solid #1f2937;
    box-shadow: -15px 0 40px rgba(0,0,0,0.6);
    padding: 1.5rem;
    overflow-y: auto;
    z-index: 50;
    border-radius: 0 0 0 16px;
  }
  .panel.hidden { display: none; }
  .panel h2 {
    color: #38bdf8;
    margin-bottom: 0.75rem;
    font-size: 1.35rem;
    border-bottom: 2px solid #1f2937;
    padding-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .close-btn {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
  }
  .close-btn:hover { color: #fff; }
  .info-row {
    margin-bottom: 1rem;
    padding: 0.75rem;
    background: #0b0c10;
    border-radius: 8px;
    border: 1px solid #1f2937;
  }
  .info-row b {
    color: #38bdf8;
    display: block;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
  }
  .info-row p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; }
  .type-badge {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  .type-bone { background: #38bdf8; color: #0f172a; }
  .type-muscle { background: #ea580c; color: #fff; }
  .empty {
    text-align: center;
    color: #64748b;
    padding: 3rem 1rem;
    font-size: 1.1rem;
  }
  .legend {
    margin-left: auto;
    display: flex;
    gap: 1rem;
    align-items: center;
    font-size: 0.8rem;
    color: #94a3b8;
  }
  .legend span { display: flex; align-items: center; gap: 0.4rem; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.bone { background: #f1f5f9; border: 1px solid #cbd5e1; }
  .dot.muscle { background: #ea580c; }
  @media (max-width: 768px) {
    .panel { width: 100%; right: -100%; position: fixed; bottom: auto; height: 55vh; top: 45vh; border-radius: 16px 16px 0 0; transition: right 0.3s; }
    .panel.show { right: 0; }
    header { flex-direction: column; gap: 1rem; align-items: flex-start; }
    .stage { padding: 1rem 0.5rem; }
  }
</style>
</head>
<body>

<header>
  <h1>🦴 İnsan Anatomi Oyunu</h1>
  <div class="legend">
    <span><span class="dot bone"></span> İskelet</span>
    <span><span class="dot muscle"></span> Kas</span>
  </div>
</header>

<div class="controls">
  <div class="btn-group">
    <button class="btn active" id="modeBone" onclick="setMode('bone')">İskelet</button>
    <button class="btn" id="modeMuscle" onclick="setMode('muscle')">Kaslı Vücut</button>
  </div>
  <div class="btn-group">
    <button class="btn active" id="dirFront" onclick="setDir('front')">Ön Yüz</button>
    <button class="btn" id="dirBack" onclick="setDir('back')">Arka Yüz</button>
  </div>
  <span style="font-size:0.85rem; color:#94a3b8;">İpucu: Kemik veya kas üzerine tıkla → sağ panelde isim, özellik, konum ve bağlantıları görün.</span>
</div>

<div class="stage">
  <svg id="anatomy" class="anatomy" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" tabindex="0" role="region" aria-label="Anatomi vücut şeması"></svg>
</div>

<div class="panel hidden" id="panel">
  <h2><span id="panelTitle">Parça Seçin</span><button class="close-btn" onclick="hidePanel()">&times;</button></h2>
  <span class="type-badge type-bone" id="panelType">İskelet</span>
  <div id="panelContent">
    <div class="empty">Bir kemik veya kasa seçin.</div>
  </div>
</div>

/* ============================================================
   UYGULAMA DURUMU
   ============================================================ */
let mode = 'bone';      // 'bone' | 'muscle'
let dir = 'front';      // 'front' | 'back'
let selectedId = null;

const svg = document.getElementById('anatomy');
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
const panelType = document.getElementById('panelType');
const panelContent = document.getElementById('panelContent');

function getData() {
  if (mode === 'bone') {
    return dir === 'front' ? bonesFront : bonesBack;
  } else {
    return dir === 'front' ? musclesFront : musclesBack;
  }
}

function clearSVG() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function draw() {
  clearSVG();
  const data = getData();
  const isBone = mode === 'bone';

  data.forEach(item => {
    let el;
    if (item.shape === 'circle') {
      el = document.createElementNS('http://www.w3.org/2000/svg','circle');
      el.setAttribute('cx', item.x);
      el.setAttribute('cy', item.y);
      el.setAttribute('r', item.r || 12);
    } else if (item.shape === 'path') {
      el = document.createElementNS('http://www.w3.org/2000/svg','path');
      el.setAttribute('d', item.d);
    } else if (item.shape === 'rect') {
      el = document.createElementNS('http://www.w3.org/2000/svg','rect');
      el.setAttribute('x', item.x);
      el.setAttribute('y', item.y);
      el.setAttribute('width', item.w || 30);
      el.setAttribute('height', item.h || 20);
      el.setAttribute('rx', 4);
      el.setAttribute('ry', 4);
    } else {
      el = document.createElementNS('http://www.w3.org/2000/svg','rect');
      el.setAttribute('x', item.x - 15);
      el.setAttribute('y', item.y - 15);
      el.setAttribute('width', 30);
      el.setAttribute('height', 30);
    }

    el.setAttribute('class', isBone ? 'bone' : 'muscle');
    el.setAttribute('data-id', item.id);
    el.setAttribute('onclick', `selectItem('${isBone ? 'bone' : 'muscle'}','${item.id}')`);
    el.setAttribute('tabindex','0');
    el.setAttribute('role','button');
    el.setAttribute('aria-label', item.name);
    if (selectedId === item.id) el.classList.add('selected');

    svg.appendChild(el);

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', item.x);
    label.setAttribute('y', isBone ? item.y + (item.r || 12) + 16 : item.y + 20);
    label.setAttribute('class','label');
    label.setAttribute('text-anchor','middle');
    label.textContent = item.name;
    svg.appendChild(label);
  });
}

function setMode(m) {
  mode = m;
  selectedId = null;
  updateBtns();
  draw();
  hidePanel();
}

function setDir(d) {
  dir = d;
  selectedId = null;
  updateBtns();
  draw();
  hidePanel();
}

function updateBtns() {
  document.getElementById('modeBone').classList.toggle('active', mode === 'bone');
  document.getElementById('modeMuscle').classList.toggle('active', mode === 'muscle');
  document.getElementById('dirFront').classList.toggle('active', dir === 'front');
  document.getElementById('dirBack').classList.toggle('active', dir === 'back');
}

function findItem(type, id) {
  const data = getData();
  return data.find(i => i.id === id);
}

function selectItem(type, id) {
  selectedId = id;
  draw();
  const item = findItem(type, id);
  if (!item) return;

  panelType.textContent = type === 'bone' ? 'İskelet / Kemik' : 'Kaslı Vücut / Kas';
  panelType.className = 'type-badge ' + (type === 'bone' ? 'type-bone' : 'type-muscle');
  panelTitle.textContent = item.name;

  let extra = '';
  if (type === 'bone') {
    extra = `
      <div class="info-row"><b>Nerede bulunur</b><p>${item.where}</p></div>
      <div class="info-row"><b>Özellikler</b><p>${item.features}</p></div>
      <div class="info-row"><b>Bağlı olduğu kemikler</b><p>${item.connects}</p></div>
    `;
  } else {
    extra = `
      <div class="info-row"><b>Nerede bulunur</b><p>${item.where}</p></div>
      <div class="info-row"><b>Özellikler</b><p>${item.features}</p></div>
      <div class="info-row"><b>Bağlı olduğu kemik(ler)</b><p>${item.attaches}</p></div>
    `;
  }

  panelContent.innerHTML = extra;
  panel.classList.remove('hidden');
  setTimeout(() => panel.classList.add('show'), 50);
}

function hidePanel() {
  panel.classList.remove('show');
  setTimeout(() => { panel.classList.add('hidden'); selectedId = null; draw(); }, 300);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && selectedId) {
    selectItem(mode, selectedId);
  }
});

draw();
</script>
